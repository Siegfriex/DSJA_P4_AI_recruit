[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dsja-p4-ai-recruit"
version = "0.1.0"
description = "Local-first Linkareer and NCS data system for DSJA P4"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.3,<2",
  "jsonschema>=4.23,<5",
  "nbformat>=5.10,<6",
  "pandas>=2.2,<3",
  "pyarrow>=20,<24",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
  "typer>=0.16,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
p4 = "p4.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/p4"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
