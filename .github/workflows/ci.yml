name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run p4 contract validate
      - run: uv run python scripts/check_source_notebooks.py
      - run: uv run python scripts/secret_scan.py
      - name: Enforce no network tests
        run: test ! -e .allow-network-ci
